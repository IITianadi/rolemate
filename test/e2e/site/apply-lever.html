<!doctype html><html><head><title>Acme Payments – Senior Backend Engineer – Apply</title></head><body>
<!-- Approximation of a Lever application page (jobs.lever.co). Structure follows .application-question / .application-label. -->
<h1>Senior Backend Engineer</h1>
<form id="application-form" onsubmit="window.__submitted=true;return false">
 <ul>
  <li class="application-question resume"><label><div class="application-label">Resume/CV <span class="required">✱</span></div><input type="file" name="resume" accept=".pdf,.doc,.docx"></label></li>
  <li class="application-question"><label><div class="application-label">Full name <span class="required">✱</span></div><div class="application-field"><input type="text" name="name" required></div></label></li>
  <li class="application-question"><label><div class="application-label">Email <span class="required">✱</span></div><div class="application-field"><input type="email" name="email" required></div></label></li>
  <li class="application-question"><label><div class="application-label">Phone</div><div class="application-field"><input type="text" name="phone"></div></label></li>
  <li class="application-question"><label><div class="application-label">Current company</div><div class="application-field"><input type="text" name="org" value="My own startup"></div></label></li>
  <li class="application-question"><label><div class="application-label">LinkedIn URL</div><div class="application-field"><input type="text" name="urls[LinkedIn]"></div></label></li>
  <li class="application-question"><label><div class="application-label">GitHub URL</div><div class="application-field"><input type="text" name="urls[GitHub]"></div></label></li>
 </ul>
 <div class="application-question custom-question"><div class="application-label">Are you willing to relocate?</div>
  <ul><li><label><input type="radio" name="cards[1]" value="Yes"><span>Yes</span></label></li><li><label><input type="radio" name="cards[1]" value="No"><span>No</span></label></li></ul></div>
 <div class="application-question custom-question"><label><div class="application-label">What is your notice period?</div><input type="text" name="cards[2]"></label></div>
 <div class="application-question custom-question"><label><div class="application-label">Why do you want to work at Acme? <span class="required">✱</span></div><textarea name="cards[3]" required></textarea></label></div>
 <div class="application-question custom-question"><label><div class="application-label">Favourite database engine</div><input type="text" name="cards[4]"></label></div>
 <div class="application-question"><label><div class="application-label">Gender</div><select name="eeo[gender]"><option value="">Select…</option><option>Male</option><option>Female</option><option>Decline to self-identify</option></select></label></div>
 <input type="text" name="honeypot_field" style="position:absolute;left:-9999px" tabindex="-1">
 <button type="submit" id="btn-submit" onclick="window.__submitClicked=true">Submit application</button>
</form></body></html>
