<!doctype html><html><head><title>Careers at Globex – Apply</title></head><body>
<header><form role="search"><input type="search" name="q" placeholder="Search jobs"></form></header>
<h1>Data Analyst</h1>
<form action="/submit" onsubmit="window.__submitted=true;return false">
 <label for="fn">First name *</label><input id="fn" name="first_name" required>
 <label for="ln">Last name *</label><input id="ln" name="last_name" required>
 <label for="em">Email address *</label><input id="em" name="email" type="email" required>
 <label for="ph">Mobile number</label><input id="ph" name="phone" type="tel">
 <label for="np">Notice period (in days)</label><input id="np" name="np" type="number">
 <label for="exp">Years of experience with Tableau</label><input id="exp" name="tab" type="number">
 <label for="loc">Current city</label><select id="loc" name="city"><option value="">Choose</option><option>Pune</option><option>Gurugram</option><option>Chennai</option></select>
 <div><p>Are you willing to relocate?</p><label><input type="radio" name="rel" value="Yes"> Yes</label> <label><input type="radio" name="rel" value="No"> No</label></div>
 <label for="pw">Create a password</label><input id="pw" name="password" type="password">
 <label for="dob">Date of birth</label><input id="dob" name="dob" type="date">
 <label for="cv">Upload your CV</label><input id="cv" name="cv" type="file" accept=".pdf">
 <input type="text" name="website_url" style="display:none" value="">
 <button type="submit">Apply now</button>
</form></body></html>
